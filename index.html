<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motrix</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #0b0f0e;
      }

      .app-bootstrap {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        color: #dce8e2;
        background: radial-gradient(circle at 50% 12%, #202820 0, #151515 44%, #0b0f0e 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      .app-bootstrap--leaving {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .app-bootstrap__content {
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
      }

      .app-bootstrap__mark {
        position: relative;
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border: 1px solid rgb(102 227 154 / 34%);
        border-radius: 17px;
        color: #8ef0ae;
        background: rgb(102 227 154 / 9%);
        box-shadow: 0 18px 48px rgb(0 0 0 / 32%);
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.06em;
      }

      .app-bootstrap__mark::after {
        position: absolute;
        inset: -7px;
        border: 1px solid rgb(102 227 154 / 16%);
        border-radius: 23px;
        content: "";
        animation: app-bootstrap-pulse 1.8s ease-out infinite;
      }

      .app-bootstrap__title {
        margin: 4px 0 0;
        font-size: 23px;
        font-weight: 750;
        letter-spacing: 0.01em;
      }

      .app-bootstrap__status {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        color: #b7bfb4;
        font-size: 14px;
      }

      .app-bootstrap__spinner {
        width: 15px;
        height: 15px;
        border: 2px solid rgb(183 191 180 / 24%);
        border-top-color: #66e39a;
        border-radius: 50%;
        animation: app-bootstrap-spin 0.8s linear infinite;
      }

      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes app-bootstrap-pulse {
        0% {
          opacity: 0.72;
          transform: scale(0.92);
        }
        70%,
        100% {
          opacity: 0;
          transform: scale(1.16);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap,
        .app-bootstrap__mark::after,
        .app-bootstrap__spinner {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main id="app-bootstrap" class="app-bootstrap" role="status" aria-live="polite" aria-label="Motrix 正在加载">
      <div class="app-bootstrap__content">
        <div class="app-bootstrap__mark" aria-hidden="true">M</div>
        <p class="app-bootstrap__title">Motrix</p>
        <p class="app-bootstrap__status">
          <span class="app-bootstrap__spinner" aria-hidden="true"></span>
          <span id="app-bootstrap-status">正在建立安全连接…</span>
        </p>
      </div>
    </main>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
