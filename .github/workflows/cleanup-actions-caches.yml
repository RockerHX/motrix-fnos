name: Cleanup Actions Caches

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Cache cleanup scope"
        required: true
        default: all
        type: choice
        options:
          - all
          - non-main
  schedule:
    - cron: "23 19 * * 0"

permissions:
  actions: write

jobs:
  cleanup-caches:
    runs-on: ubuntu-latest

    steps:
      - name: Delete selected caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CACHE_SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          set -euo pipefail
          page=1
          deleted=0
          ids_file="$(mktemp)"

          while :; do
            response="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/caches?per_page=100&page=${page}")"

            count="$(jq '.actions_caches | length' <<<"${response}")"
            if [ "${count}" -eq 0 ]; then
              break
            fi

            jq -r --arg scope "${CACHE_SCOPE}" '
              .actions_caches[]
              | select($scope == "all" or .ref != "refs/heads/main")
              | [.id, .key, .ref, .size_in_bytes]
              | @tsv
            ' <<<"${response}" >> "${ids_file}"

            page=$((page + 1))
          done

          while IFS=$'\t' read -r id key ref size; do
            if [ -z "${id}" ]; then
              continue
            fi
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/caches/${id}" >/dev/null
            deleted=$((deleted + 1))
            echo "deleted cache ${id}: ${key} (${ref}, ${size} bytes)"
          done < <(sort -u "${ids_file}")

          echo "deleted ${deleted} cache(s), scope=${CACHE_SCOPE}"
