name: Auto Merge Release PR

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-release-pr:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'release/v')
    runs-on: ubuntu-latest

    steps:
      - name: Merge verified release PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_json="$(gh pr list \
            --repo "${REPO}" \
            --head "${HEAD_BRANCH}" \
            --base main \
            --state open \
            --json number,headRefName,baseRefName,headRefOid,isCrossRepository \
            --limit 1)"

          pr_number="$(jq -r '.[0].number // empty' <<<"${pr_json}")"
          if [ -z "${pr_number}" ]; then
            echo "没有找到 ${HEAD_BRANCH} -> main 的 open release PR，跳过。"
            exit 0
          fi

          head_ref="$(jq -r '.[0].headRefName' <<<"${pr_json}")"
          base_ref="$(jq -r '.[0].baseRefName' <<<"${pr_json}")"
          pr_head_sha="$(jq -r '.[0].headRefOid' <<<"${pr_json}")"
          is_cross_repository="$(jq -r '.[0].isCrossRepository' <<<"${pr_json}")"

          if [ "${is_cross_repository}" != "false" ]; then
            echo "Release PR 必须来自当前仓库，已中止。"
            exit 1
          fi

          if [ "${head_ref}" != "${HEAD_BRANCH}" ] || [ "${base_ref}" != "main" ]; then
            echo "PR 分支不匹配：head=${head_ref}, base=${base_ref}，已中止。"
            exit 1
          fi

          if [ "${pr_head_sha}" != "${HEAD_SHA}" ]; then
            echo "Verify 对应的 SHA ${HEAD_SHA} 已不是 PR 当前 head ${pr_head_sha}，跳过本次自动合并。"
            exit 0
          fi

          allowed_paths="$(mktemp)"
          printf '%s\n' \
            'CHANGELOG.md' \
            'package.json' \
            'packaging/fnos/app/ui/config' \
            'packaging/fnos/manifest.template' \
            'server/Cargo.lock' \
            'server/Cargo.toml' \
            > "${allowed_paths}"

          changed_paths="$(gh pr diff --repo "${REPO}" "${pr_number}" --name-only)"
          unexpected_paths="$(grep -vxF -f "${allowed_paths}" <<<"${changed_paths}" || true)"
          if [ -n "${unexpected_paths}" ]; then
            echo "Release PR 包含非发版白名单文件，拒绝自动合并："
            echo "${unexpected_paths}"
            exit 1
          fi

          if [ -z "${changed_paths}" ]; then
            echo "Release PR 没有文件改动，拒绝自动合并。"
            exit 1
          fi

          echo "Verify 已通过，PR #${pr_number} 仅包含发版白名单文件，准备自动合并。"
          gh pr merge --repo "${REPO}" "${pr_number}" --squash --delete-branch
