name: Tag Release PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  tag-release:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Create release tag
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          expected_branch="release/${tag}"

          if [ "${HEAD_BRANCH}" != "${expected_branch}" ]; then
            echo "Release PR 分支 ${HEAD_BRANCH} 与项目版本 ${version} 不匹配，期望 ${expected_branch}" >&2
            exit 1
          fi

          git fetch --tags --force
          target_sha="$(git rev-parse HEAD)"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "${tag}")"
            if [ "${tag_sha}" = "${target_sha}" ]; then
              echo "Tag ${tag} 已存在且指向当前 merge commit，跳过。"
              exit 0
            fi
            echo "Tag ${tag} 已存在但不指向当前 merge commit，已中止。" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${tag}"
          git push origin "${tag}"
