name: Release FPK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 1.4.2"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  models: read
  attestations: write
  id-token: write

concurrency:
  group: release-fpk
  cancel-in-progress: false

jobs:
  release-fpk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.93.0
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Cache Rust registry
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: server -> target
          shared-key: rust-registry
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit production dependencies
        run: pnpm run audit:deps

      - name: Prepare release files
        id: release_files
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          MOTRIX_RELEASE_CHANGELOG_PROVIDER: github-models
          MOTRIX_RELEASE_ANALYSIS_MODEL: openai/gpt-4.1-mini
          MOTRIX_RELEASE_EDITOR_MODEL: openai/gpt-4.1
          MOTRIX_RELEASE_MODEL_MIN_INTERVAL_MS: 7000
        run: |
          set -euo pipefail

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号必须使用 x.y.z 格式，实际为：${VERSION}" >&2
            exit 1
          fi

          git fetch origin main --tags --force
          git switch -C main origin/main

          current_version="$(node -p "require('./package.json').version")"
          if [ "${current_version}" = "${VERSION}" ]; then
            echo "main 已经是 ${VERSION}，进入幂等发布模式。"
            node scripts/version-check.mjs
            echo "mode=existing" >> "${GITHUB_OUTPUT}"
          else
            node scripts/release-prepare.mjs "${VERSION}" --no-verify --no-commit --no-tag
            cargo metadata --manifest-path server/Cargo.toml --format-version 1 >/dev/null
            node scripts/version-check.mjs
            echo "mode=new" >> "${GITHUB_OUTPUT}"
          fi

          node scripts/release-notes.mjs "${VERSION}" > release-notes.md
          node scripts/release-notes.mjs "${VERSION}" --body > release-notes-body.md
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Run quick verification
        run: pnpm run verify:pre-commit

      - name: Install FPK cross build dependencies
        run: |
          set -euo pipefail
          cargo install --locked cargo-zigbuild
          python3 -m pip install --user --break-system-packages ziglang
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          cargo-zigbuild --version
          cargo zigbuild --help >/dev/null
          command -v python-zig

      - name: Build FPK packages
        run: pnpm run build:fpk

      - name: Verify FPK artifacts
        env:
          VERSION: ${{ steps.release_files.outputs.version }}
        run: |
          set -euo pipefail
          test -f "packaging/fnos/dist/motrix_${VERSION}_x86.fpk"
          test -f "packaging/fnos/dist/motrix_${VERSION}_arm.fpk"
          node scripts/generate-fpk-sbom.mjs --version "${VERSION}" --output-dir packaging/fnos/dist
          (cd packaging/fnos/dist && sha256sum "motrix_${VERSION}_"*.fpk "motrix_${VERSION}_"*.spdx.json > SHA256SUMS.txt)
          cat packaging/fnos/dist/SHA256SUMS.txt

      - name: Attest FPK and release metadata
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            packaging/fnos/dist/motrix_${{ steps.release_files.outputs.version }}_*.fpk
            packaging/fnos/dist/motrix_${{ steps.release_files.outputs.version }}_*.spdx.json
            packaging/fnos/dist/SHA256SUMS.txt

      - name: Commit release files and tag
        env:
          VERSION: ${{ steps.release_files.outputs.version }}
          RELEASE_TAG: ${{ steps.release_files.outputs.tag }}
          RELEASE_MODE: ${{ steps.release_files.outputs.mode }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main --tags --force
          remote_main_sha="$(git rev-parse origin/main)"

          if [ "${RELEASE_MODE}" = "new" ]; then
            git add \
              CHANGELOG.md \
              package.json \
              packaging/fnos/app/ui/config \
              packaging/fnos/manifest.template \
              server/Cargo.lock \
              server/Cargo.toml

            if git diff --cached --quiet; then
              echo "没有 release 文件改动，已中止。" >&2
              exit 1
            fi

            git commit -m "chore: 发布 ${VERSION} 版本" -m "$(cat release-notes-body.md)"

            base_sha="$(git rev-parse HEAD^)"
            if [ "${base_sha}" != "${remote_main_sha}" ]; then
              echo "远端 main 已从 ${base_sha} 前进到 ${remote_main_sha}，为避免覆盖新提交，已中止。" >&2
              exit 1
            fi
          else
            head_sha="$(git rev-parse HEAD)"
            if [ "${head_sha}" != "${remote_main_sha}" ]; then
              echo "当前 HEAD ${head_sha} 不是远端 main ${remote_main_sha}，已中止。" >&2
              exit 1
            fi
          fi

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            head_sha="$(git rev-parse HEAD)"
            if [ "${tag_sha}" != "${head_sha}" ]; then
              echo "Tag ${RELEASE_TAG} 已存在但不指向当前提交，已中止。" >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} 已存在且指向当前提交，跳过创建 tag。"
          else
            git tag "${RELEASE_TAG}"
            if [ "${RELEASE_MODE}" = "new" ]; then
              git push --atomic origin HEAD:refs/heads/main "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            else
              git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            fi
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: motrix-fnos-${{ steps.release_files.outputs.version }}-fpk
          path: |
            packaging/fnos/dist/*.fpk
            packaging/fnos/dist/*.spdx.json
            packaging/fnos/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_files.outputs.tag }}
          VERSION: ${{ steps.release_files.outputs.version }}
        run: |
          set -euo pipefail

          release_download_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          {
            cat release-notes.md
            echo
            echo "## 下载与校验"
            echo
            echo "请根据 fnOS 设备 CPU 架构选择对应的 FPK："
            echo
            echo "- x86_64：[motrix_${VERSION}_x86.fpk](${release_download_base}/motrix_${VERSION}_x86.fpk)"
            echo "- aarch64 / arm64：[motrix_${VERSION}_arm.fpk](${release_download_base}/motrix_${VERSION}_arm.fpk)"
            echo "- 校验文件：[SHA256SUMS.txt](${release_download_base}/SHA256SUMS.txt)"
            echo "- SBOM：[motrix_${VERSION}_x86.fpk.spdx.json](${release_download_base}/motrix_${VERSION}_x86.fpk.spdx.json)、[motrix_${VERSION}_arm.fpk.spdx.json](${release_download_base}/motrix_${VERSION}_arm.fpk.spdx.json)"
          } > github-release-notes.md

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" packaging/fnos/dist/*.fpk packaging/fnos/dist/*.spdx.json packaging/fnos/dist/SHA256SUMS.txt --clobber
            gh release edit "${RELEASE_TAG}" --title "Motrix ${RELEASE_TAG}" --notes-file github-release-notes.md
          else
            gh release create "${RELEASE_TAG}" packaging/fnos/dist/*.fpk packaging/fnos/dist/*.spdx.json packaging/fnos/dist/SHA256SUMS.txt \
              --title "Motrix ${RELEASE_TAG}" \
              --notes-file github-release-notes.md
          fi

      - name: Close obsolete release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_files.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then
            exit 0
          fi

          branch="release/v${VERSION}"
          pr_number="$(gh pr list --head "${branch}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "${pr_number}" ]; then
            echo "没有需要关闭的旧 release PR。"
            exit 0
          fi

          gh pr close "${pr_number}" --delete-branch --comment "已改由 Release FPK workflow 直接发布 v${VERSION}，关闭旧自动 PR。" || true
