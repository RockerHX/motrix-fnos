name: Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - package.json
      - server/Cargo.toml
      - server/Cargo.lock
      - packaging/fnos/manifest.template
      - packaging/fnos/app/ui/config
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification
        run: pnpm run verify

      - name: Install FPK cross build dependencies
        run: |
          cargo install --locked cargo-zigbuild
          python3 -m pip install --user --break-system-packages ziglang
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          cargo-zigbuild --version
          cargo zigbuild --help >/dev/null
          command -v python-zig

      - name: Verify FPK packaging preparation
        run: pnpm run build:fpk:prepare
