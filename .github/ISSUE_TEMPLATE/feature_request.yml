name: 功能建议
description: 提交一个明确的功能或改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请先确认没有相同或相近的 Issue，并说明实际使用场景。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前遇到的限制，以及它对使用造成的影响。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的功能或行为
      description: 请具体描述期望的操作方式和结果。
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 请说明使用环境、目标用户和典型流程。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方案
      description: 如果有临时方案或其他工具，请一并说明。

  - type: textarea
    id: additional_context
    attributes:
      label: 其他信息
      description: 可补充截图、参考链接或实现思路。
