[package]
name = "motrix-fnos-server"
version = "1.9.4"
edition = "2021"

[lints.rust]
warnings = "deny"

[lib]
name = "motrix_fnos_server"
path = "src/lib.rs"

[dependencies]
argon2 = "0.5"
async-stream = "0.3"
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
base64 = "0.22"
fs2 = "0.4"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["fs", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
zip = { version = "=7.2.0", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
